buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath 'com.android.tools.build:gradle:9.0.1'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

def DEFAULT_COMPILE_SDK_VERSION = 36
def DEFAULT_MIN_SDK_VERSION = 24
def DEFAULT_TARGET_SDK_VERSION = 36

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def supportsNamespace() {
    def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
    def major = parsed[0].toInteger()
    def minor = parsed[1].toInteger()

    return major > 7 || (major == 7 && minor >= 3)
}

android {
    if (supportsNamespace()) {
        namespace 'com.reactnativeunityshow'
    }

    compileSdkVersion safeExtGet(
        'compileSdkVersion',
        safeExtGet('UnityShow_compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)
    )

    defaultConfig {
        minSdkVersion safeExtGet(
            'minSdkVersion',
            safeExtGet('UnityShow_minSdkVersion', DEFAULT_MIN_SDK_VERSION)
        )
        targetSdkVersion safeExtGet(
            'targetSdkVersion',
            safeExtGet('UnityShow_targetSdkVersion', DEFAULT_TARGET_SDK_VERSION)
        )
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'GradleCompatible'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenLocal()
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
}
